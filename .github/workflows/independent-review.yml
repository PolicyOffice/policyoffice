name: independent review

# `agent-workflow.md` makes this one of the three merge conditions. It is an honest signal,
# not a simulated human approval -- read `CONTRIBUTING.md` for exactly what it does and
# does not mean.
#
# The property that matters: a review records the commit it reviewed. When new commits are
# pushed the recorded sha no longer matches HEAD, the check goes back to pending, and code
# nobody looked at cannot ride in behind a stale approval.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  record:
    # Named differently from the status context it writes. If the job were also called
    # "independent review" there would be two checks with that name -- this job, which
    # passes as soon as it has written a status, and the status itself, which carries the
    # actual signal. A branch ruleset requiring the name would then be satisfied by the
    # wrong one.
    name: record independent review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      # No checkout of pull-request code. The evaluator and reviewer list are fetched from
      # the default branch; the pull request's sha is comparison data, never executable code.
      - name: Evaluate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event_name == 'pull_request_target' && github.event.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          echo "head is $HEAD_SHA"

          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPO/contents/tooling/independent-review.ts?ref=$DEFAULT_BRANCH" \
            > "$RUNNER_TEMP/independent-review.ts"
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPO/contents/.github/independent-reviewers.json?ref=$DEFAULT_BRANCH" \
            > "$RUNNER_TEMP/independent-reviewers.json"
          gh api "repos/$REPO/issues/$PR/comments" --paginate --slurp \
            > "$RUNNER_TEMP/review-comments.json"

          RESULT=$(node "$RUNNER_TEMP/independent-review.ts" "$HEAD_SHA" \
            "$RUNNER_TEMP/review-comments.json" "$RUNNER_TEMP/independent-reviewers.json")
          STATE=$(jq -r .state <<< "$RESULT")
          DESC=$(jq -r .description <<< "$RESULT")
          echo "$STATE — $DESC"

          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f context="independent review" \
            -f description="$DESC" \
            -f target_url="https://github.com/$REPO/blob/main/CONTRIBUTING.md" > /dev/null
