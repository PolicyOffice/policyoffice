name: Set up the workspace
description: Node, pnpm and a locked install. Shared by every gate so they cannot drift apart.

runs:
  using: composite
  steps:
    - name: Install pnpm
      # Pinned to a commit, not a tag. A tag is mutable, and this is a supply-chain
      # surface on a repository whose whole proposition is trustworthiness.
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        # From .nvmrc, so CI and a developer's machine cannot disagree about the runtime.
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      # --frozen-lockfile: the gate list starts with "locked dependency install". A CI run
      # that silently resolves a different dependency tree is testing something other than
      # what will be merged.
      run: pnpm install --frozen-lockfile
