# Local development environment.
#
# Everything the application needs, running locally, with no accounts and no cost.
# Object storage is local too (MinIO speaks the S3 API), so nothing developed against
# it is accidentally coupled to one provider — see ADR-0004.
#
#   docker compose up -d
#   docker compose down -v      # -v also drops the data
#
# This is not the CI database. CI runs a Postgres service container per job
# (ADR-0009), and production is Neon. Platform-specific behaviour is verified
# separately, in verification/.

services:
  postgres:
    image: postgres:18-alpine
    container_name: policyoffice-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-policyoffice}
      # Deterministic collation, so ordering does not vary with the host locale.
      # Evidence packs sort records; sorting must not depend on the machine.
      LANG: C
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Mounted at /var/lib/postgresql, NOT /var/lib/postgresql/data. The postgres:18+
      # images store data in a major-version-specific subdirectory so that pg_upgrade
      # --link works without crossing a mount boundary. Mounting the old path makes the
      # container refuse to start. Do not "fix" this back to .../data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-policyoffice}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for controlled files and evidence packs.
  #
  # Silo, Pigsty's maintained fork of MinIO, not MinIO's own image -- the founder's decision
  # on 2026-09-29. MinIO went source-only in October 2025, deleted its Docker Hub images on
  # 2026-09-11, and by 2026-09-26 its Quay repositories refused anonymous pulls too, so every
  # CI run failed pulling this service before any test ran. Silo keeps MinIO's S3 API,
  # environment variables and `mc`, and publishes versioned releases. Pinned by digest as well
  # as tag, so a moved tag cannot change what CI executes. The integration and Playwright
  # suites are what prove it behaves like MinIO where we depend on it: conditional writes,
  # single-use presigned uploads, expiry and CORS.
  minio:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    container_name: policyoffice-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Captures outbound mail so reminders and campaign notifications can be
  # inspected without sending anything. Web UI on :8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: policyoffice-mailpit
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  minio-data:
